# Example: 3-bladed 40 m rotor, NACA 2412 everywhere, Betz-optimum chord/twist for TSR 7
# (design alpha 6 deg, root chord capped at 3.2 m, twist capped at 20 deg).
# Every key is documented in README.md; omitted keys fall back to bem_blade/config.py DEFAULTS.

airfoil:
  naca: "2412"
  polar_file: null          # CSV with Re, alpha_deg, Cl, Cd (see `bem-blade polar`); null = fallback model
  alpha_stall_deg: 12.0
  cd0: null                 # null = flat-plate estimate from local Re

rotor:
  B: 3
  R: 40.0
  r_hub: 2.0
  pitch_deg: 0.0

stations:
  r:         [2.000, 3.947, 5.895, 7.842, 9.789, 11.737, 13.684, 15.632, 17.579, 19.526,
              21.474, 23.421, 25.368, 27.316, 29.263, 31.211, 33.158, 35.105, 37.053, 39.000]
  chord:     [3.200, 3.200, 3.200, 3.200, 3.200, 3.200, 3.200, 3.200, 3.200, 3.200,
              3.045, 2.813, 2.613, 2.438, 2.284, 2.148, 2.028, 1.919, 1.822, 1.734]
  theta_deg: [20.000, 20.000, 20.000, 18.053, 14.183, 11.306, 9.110, 7.387, 6.005, 4.875,
              3.934, 3.141, 2.463, 1.877, 1.366, 0.917, 0.519, 0.164, -0.155, -0.443]

operating:
  U_inf: 10.0               # scalar, or a list for an envelope sweep
  Omega: 1.75               # rad/s (scalar or list matching U_inf); or give tsr instead
  tsr: null

air:
  rho: 1.225
  mu: 1.81e-5

structure:
  model: shell              # solid | shell | user
  skin_thickness: 0.02      # [m]  (or skin_thickness_frac: fraction of local chord)
  material:
    E: 40.0e9
    sigma_allow_tension: 200.0e6
    sigma_allow_compression: 150.0e6
    density: 1900.0
  include_gravity: true
  include_centrifugal: true

output:
  dir: results/blade_40m
  plots: true
