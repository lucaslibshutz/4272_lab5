# Blade 7 — 3-bladed, 7 in (0.1778 m) SLA-printed rotor, NACA 4412, U_inf = 15 m/s, at its
# freewheeling speed. Run:  uv run bem-blade run examples/blade7.yaml
#
# Model: the lab handout's blade-element theory (solver.model = blade_element), as derived in
#   ../lab5_writeup: no induction or tip/hub loss, loads at all 20 stations, trapezoid rule,
#   Omega_ss from Q(Omega) = 0. Use --set solver.model=bem for the momentum (BEM) model.
# Geometry: data/Blade7_geometry.xlsx (r [m], pitch [deg], chord [m]). Its "pitch" convention
#   (positive = leading edge upstream of the rotor plane) is PLAN.md §1's theta, used as-is.
# Material: Formlabs Grey Resin V4.1 TDS (25011042-TDS-ENUS), post-cured 30 min @ 60 C.

airfoil:
  naca: "4412"
  polar_file: ../data/naca4412_airfoiltools.csv # XFOIL, Ncrit 9 (scripts/fetch_airfoiltools.py)
  alpha_stall_deg: 12.0                         # used only for the stall flag with a table

rotor:
  B: 3
  R: 0.1778          # tip radius [m] = last station
  r_hub: 0.0254      # blade/hub joint (first profile in the sheet)
  pitch_deg: 0.0     # collective offset added on top of the sheet's pitch

stations:
  file: ../data/Blade7_geometry.xlsx

operating:
  U_inf: 15.0
  rpm: freewheel     # solve Q(Omega) = 0; or a list, e.g. --set "operating.rpm=[1000,2000,3600]"

solver:
  model: blade_element

air:
  rho: 1.225
  mu: 1.81e-5

structure:
  model: solid
  material:
    E: 2.201e9                      # tensile modulus, post-cured (ASTM D638-14)
    sigma_allow_tension: 47.0e6     # ultimate tensile strength, post-cured (ASTM D638-14)
    sigma_allow_compression: 47.0e6 # NOT on the TDS; set = UTS (conservative for SLA resins)
    density: 1180.0                 # NOT on the TDS; typical cured SLA resin [kg/m^3]
  include_gravity: true
  include_centrifugal: true

output:
  dir: results/blade7
